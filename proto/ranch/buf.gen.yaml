version: v2
plugins:
  - remote: buf.build/protocolbuffers/go
    out: ../services/Grpc/ranch/internal/pbgen
    opt: 
      - Mranch/animal/v1/animal.proto=.;pbgen
      - Mranch/v1/ranch.proto=.;pbgen
    include_imports: true
    include_wkt: false
  - remote: buf.build/grpc/go
    out: ../services/Grpc/ranch/internal/pbgen
    opt: 
      - Mranch/animal/v1/animal.proto=.;pbgen
      - Mranch/v1/ranch.proto=.;pbgen
    include_imports: true
    include_wkt: false
  - remote: buf.build/protocolbuffers/go
    out: ../services/Rest/farm_gateway/internal/pbgen
    opt:  
      - Mranch/animal/v1/animal.proto=.;pbgen
      - Mranch/v1/ranch.proto=.;pbgen
    include_imports: true
    include_wkt: false
  - remote: buf.build/grpc/go
    out: ../services/Rest/farm_gateway/internal/pbgen
    opt: 
      - Mranch/animal/v1/animal.proto=.;pbgen
      - Mranch/v1/ranch.proto=.;pbgen
    include_imports: true
    include_wkt: false
